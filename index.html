    <title>Standby</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @font-face {
        font-family: 'SF Pro Display Black';
        src: url('/SF-Pro-Display-Black.otf') format('opentype');
        font-weight: 900;
        font-style: normal;
      }
      html, body {
        background-color: black;
        font-family: 'SF Pro Display Black', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        /* Disable browser-native pull-to-refresh and swipe navigation gestures */
        overscroll-behavior-y: none;
        overscroll-behavior-x: contain;
      }
      /* Apply gesture-related styles globally to create a more app-like feel */
      * {
        -webkit-user-select: none; /* Safari */
        -moz-user-select: none; /* Firefox */
        -ms-user-select: none; /* IE10+/Edge */
        user-select: none; /* Standard */
        -webkit-tap-highlight-color: transparent; /* Disable tap highlight on iOS */
        -webkit-touch-callout: none; /* Disable callout menu on long-press */
      }
      /* Hide scrollbar for Chrome, Safari and Opera */
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      /* Hide scrollbar for IE, Edge and Firefox */
      .no-scrollbar {
          -ms-overflow-style: none;  /* IE and Edge */
          scrollbar-width: none;  /* Firefox */
      }
      /* Jiggle animation for edit mode */
      @keyframes jiggle {
        0% { transform: rotate(-0.75deg); }
        50% { transform: rotate(0.75deg); }
        100% { transform: rotate(-0.75deg); }
      }
      .jiggle {
        animation: jiggle 0.2s infinite linear;
      }
    </style>
    <script>
      tailwind.config = {
        theme: {

    </script>
